spring:
  application:
    name: mini-saas

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_saas
    username: minisaas
    password: minisaas
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/mini-saas
          jwk-set-uri: http://localhost:8088/realms/mini-saas/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

    metrics:
      enabled: true

    prometheus:
      enabled: true

  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: mini-saas
      environment: ${ENVIRONMENT:dev}

logging:
  level:
    com.example.mini_saas: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
